name: CI

# Run CI when code is pushed to main
# or when a pull request targets main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    # GitHub provides a fresh Ubuntu machine for this job.
    runs-on: ubuntu-latest

    steps:
      # 1. Download our GitHub repository onto the runner.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Python 3.11, matching our Docker image.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install application dependencies.
      # sentence-transformers installs its required PyTorch dependency.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      # 4. Run our automated tests.
      - name: Run tests
        env:
          # Test values only. No real credentials are used.
          GOOGLE_API_KEY: test-key
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: customer_support
          DB_USER: postgres
          DB_PASSWORD: test-password
        run: pytest

      # 5. Make sure the Docker image builds successfully.
      - name: Build Docker image
        run: docker build -t ai-customer-support .