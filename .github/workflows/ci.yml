name: CI/CD

# Run CI/CD when code is pushed to main.
# Run CI only for pull requests targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  
jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Python 3.11.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install application dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      # 4. Run automated tests.
      - name: Run tests
        env:
          # Test-only values. No real credentials are used.
          GOOGLE_API_KEY: test-key
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: customer_support
          DB_USER: postgres
          DB_PASSWORD: test-password
        run: pytest

      # 5. Build the Docker image.
      - name: Build Docker image
        run: docker build -t ai-customer-support .

      # 6. Authenticate GitHub Actions with Google Cloud.
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deployer@ai-customer-support-510410.iam.gserviceaccount.com

      # 7. Configure Docker to use Artifact Registry.
      - name: Configure Docker
        if: github.event_name == 'push'
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      # 8. Push Docker image to Artifact Registry.
      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker tag ai-customer-support \
            asia-south1-docker.pkg.dev/ai-customer-support-510410/ai-customer-support/ai-customer-support:latest

          docker push \
            asia-south1-docker.pkg.dev/ai-customer-support-510410/ai-customer-support/ai-customer-support:latest

      # 9. Deploy the image to Cloud Run.
      - name: Deploy to Cloud Run
        if: github.event_name == 'push'
        run: |
          gcloud run deploy ai-customer-support \
            --image=asia-south1-docker.pkg.dev/ai-customer-support-510410/ai-customer-support/ai-customer-support:latest \
            --region=asia-south1 \
            --platform=managed \
            --quiet